<div class="container">
  <!-- Comentarios -->
  <div class="comentarios">
    <h4>Comentarios:</h4>

    <ul>
      <li *ngFor="let comentario of comentarios">
        <strong>{{ comentario.autor }}:</strong> {{ comentario.texto }}

        <div class="acciones">
          <button class="btn-editar" (click)="editarComentario(comentario)">Editar</button>
          <button class="btn-eliminar" (click)="eliminarComentario(comentario.id)">Eliminar</button>
        </div>
      </li>
    </ul>

    <!-- Formulario para nuevo comentario o edición -->
    <div class="form-comentario" [ngClass]="{ 'editando': editando }">
      <h4 *ngIf="editando">Editando comentario</h4>

      <input type="text" [(ngModel)]="nuevoComentario.autor" placeholder="Tu nombre">
      <textarea [(ngModel)]="nuevoComentario.texto" placeholder="Escribe un comentario..."></textarea>

      <!-- Botones -->
      <div class="botones-formulario">
        <button *ngIf="!editando" (click)="agregarComentario()">Comentar</button>
        <button *ngIf="editando" (click)="actualizarComentario()">Actualizar</button>
        <button *ngIf="editando" (click)="limpiarFormulario()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
