<div class="container">
    <ng-container *ngIf="esBlog; else esComentario">
        <div class="container" (click)="onClick(blog?.id)">
            <p class="text_1">
                {{ blog?.titulo }}
            </p>
            <p class="text">
                {{ blog?.contenido }}
            </p>
        </div>
    </ng-container>

    <ng-template #esComentario>
        <p class="text_1">
            {{ comentario?.usuario }}
        </p>
        <p class="text">
            {{ comentario?.contenido }}
        </p>
    </ng-template>
</div>
