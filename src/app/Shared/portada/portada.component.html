<div *ngIf="item">
  <!-- Si item tiene una propiedad 'portada' (probablemente de tipo Serie) -->
  <div *ngIf="isSerie(item)" class="movie-container">
    <a [routerLink]="['/descripcion-pelicula', item.id]">
      <img [src]="item.portada" alt="Imagen de la pelicula {{ item.nombre }}" class="portada">
      <div class="overlay">
        <p class="synopsis">{{ item.sinopsis }}</p>
      </div>
    </a>
  </div>

  <!-- Si item tiene una propiedad 'foto' (probablemente de tipo Actor) -->
  <div *ngIf="isActor(item)" class="movie-container">
    <a routerLink="/descripcion-pelicula">
      <img src="{{ item.foto }}" alt="Imagen de {{ item.nombre }}" class="portada">
      <div class="overlay">
        <p class="synopsis">{{ item.nombre }}</p>
      </div>
    </a>
  </div>
</div>
