<h1 class="titulos">RECOMENDACIONES</h1>

<div class="recomendaciones-contenedor" id="contenedor-recomendaciones">
  <!-- Muestra solo 3 series -->
  <div class="elemento-recomendacion" *ngFor="let serie of series.slice(0, 3)">
    <app-portada [item]="serie"></app-portada>
  </div>

  <!-- El botón como cuarto elemento del grid -->
  <div class="elemento-recomendacion">
    <!-- Enlace a otra página (por ejemplo, página de todas las recomendaciones) -->
    <a [routerLink]="['/peliculas-series']">
      <button id="boton-recomendaciones">¡VER MÁS!</button>
    </a>
  </div>
</div>
