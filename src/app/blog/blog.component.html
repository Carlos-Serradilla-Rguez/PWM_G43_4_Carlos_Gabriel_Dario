<h1 class="titulo">Reseñas de películas y series.</h1>

<div id="buscador-contenedor">
<app-buscador id="barra-busqueda"/>
</div>

<div class="principal">
  <div class="bloque">
    <div class="hilos" id="hilos-contenedor">
      <!-- Los hilos se generan con *ngFor -->
      <div *ngFor="let hilo of hilosAMostrar">
        <app-bloque-blog [hilo]="hilo" [tipo]="'comentario'" />
      </div>
    </div>

    <div id="boton-pagina">
      <a href="#" class="boton">Anterior</a>
      <a href="#" class="boton">1</a>
      <a href="#" class="boton">2</a>
      <a href="#" class="boton">3</a>
      <a href="#" class="boton">Siguiente</a>
    </div>
  </div>

  <div class="Caja" id="template-filtros">
    <app-label/>
    <!-- Aquí se puede cargar otro componente o filtro -->
  </div>
</div>

<section id="placeholder">
    <app-crear-hilo />
</section>
