<body>
<div class="lorem">
  <p>Register</p>
</div>
<div class="login-bar">
  <form action="#" method="get">
    <input type="email" name="correo" placeholder="Correo electrónico" required>
    <input type="usuario" name="nombre" placeholder="Nombre de ususario" required>
    <input type="password" name="clave" placeholder="Contraseña" required>
    <input type="password" name="confirmar_clave" placeholder="Repite la contraseña" required>
    <button type="submit">Ingresar</button>
    <a routerLink="/login" id="link-Registro">
      <p id="TengoCuenta">¿Ya estas registrado?<br>¡Inicia Sesión!</p>
    </a>
  </form>
</div>
</body>
