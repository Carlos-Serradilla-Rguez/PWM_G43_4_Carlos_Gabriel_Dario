<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Red Social dedicada a los amantes del cine.">

    <title>CineMatch</title>
    <link rel="shortcut icon" href="/img/Logo_ChatGPT.png" type="image/x-icon">

    <link rel="stylesheet" href="/styles/Union-Usuario.css">
    <script defer src="/js/Carga-Templates.js"></script>
    <script defer src="/js/menu.js"></script>

</head>
<body>
<header>
    <div id="header-contenedor"></div>
</header>

<main>
    <div id="Usuario-Descripcion">
        <img src="/img/Aspa.png" alt="Foto de perfil" id="FotoPerfil">
        <section id="Informacion-Usuario">
            <h1 id="Nombre-Usuario">Nombre del Usuario</h1>
            <p id="Descripcion">
                Descripción del usuario. Aquí se mostrará información sobre el usuario y sus intereses cinematográficos.
            </p>
        </section>
    </div>

    <section id="Mi-Lista" class="ruleta">
        <h3 id="Titulo-Similares">Mi lista</h3>
        <div id="Ruleta-Similares"></div>
    </section>

    <section id="Recomendaciones" class="ruleta">
        <h3 id="Titulo-Recomendaciones">Recomendaciones para ti</h3>
        <div id="Ruleta-Recomendaciones"></div>
    </section>

    <div>
        <button id="CerrarSesion">CERRAR SESIÓN</button>
    </div>
</main>

<footer>
    <div id="footer-contenedor"></div>
</footer>

<script>
    window.onload = function() {
        initializePage(); // Cargar header, footer y contenido dinámico
    };
</script>

</body>
</html>
