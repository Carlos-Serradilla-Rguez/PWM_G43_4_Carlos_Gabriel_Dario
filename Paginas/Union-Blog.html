<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Red Social dedicada a los amantes del cine.">

  <title>CineMatch</title>
  <link rel="shortcut icon" href="/img/Logo_ChatGPT.png" type="/image/x-icon">

  <link rel="stylesheet" href="/styles/Union-Blog.css">
  <script type="module" src="../js/Blog.js"></script>
  <script defer src="../js/menu.js"></script>
</head>

<body>
<header>
  <div id="header-contenedor" ></div>
</header>

<main>

  <h1 class="titulo">Reseñas de películas y series.</h1>

  <div id="buscador-contenedor" ></div>

  <div class="principal">
    <div class="bloque">
      <div class="hilos" id="hilos-contenedor">
        <div class="elemento-Hilo">
          <div class="centrado"></div>
          <div class="centrado"></div>
          <div class="centrado"></div>
        </div>
      </div>

      <div id="boton-pagina">
        <a href="#" class="boton">&laquo; Anterior</a>
        <a href="#" class="boton">1</a>
        <a href="#" class="boton">2</a>
        <a href="#" class="boton">3</a>
        <a href="#" class="boton">Siguiente &raquo;</a>
      </div>

    </div>


    <div class="Caja" id="template-filtros"></div>
  </div>

  <section id="placeholder"></section>



</main>

  <footer>
    <div id="footer-contenedor"></div>
  </footer>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(() => {
      const contenedorAjustes = document.getElementById("contenedor_ajustes");
      const elementosFiltro = document.querySelectorAll(".contenedor-filtro-1");
      const boton = document.querySelector(".btn-exterior");

      if (contenedorAjustes && elementosFiltro.length > 0) {
        elementosFiltro.forEach(elemento => {
          contenedorAjustes.insertBefore(elemento, boton); // Inserta los filtros antes del botón
        });
        console.log("✅ Elementos movidos correctamente dentro de #contenedor_ajustes.");
      } else {
        console.error("❌ No se encontraron elementos para mover. Verifica que '.contenedor-filtro-1' existe.");
      }
    }, 500);
  });

</script>
</body>
</html>
