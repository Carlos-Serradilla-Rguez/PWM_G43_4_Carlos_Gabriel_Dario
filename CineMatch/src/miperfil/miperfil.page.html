<ion-header>
  <ion-toolbar>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-avatar>
        <img [src]="imageUrl || 'https://via.placeholder.com/150'" alt="Foto de perfil" />
      </ion-avatar>
      <ion-card-title>{{ nombre }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Aquí se puede mostrar más información del usuario.</p>
    </ion-card-content>
  </ion-card>

  <ion-button expand="full" (click)="cerrarSesion()">Cerrar sesión</ion-button>
</ion-content>
